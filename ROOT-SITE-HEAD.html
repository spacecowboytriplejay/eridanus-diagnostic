<!--
════════════════════════════════════════════════════════════════════════════
  PASTE THIS INTO THE <head> OF THE cobusnel.com HOME PAGE.
  This is NOT for the calculator repo. It belongs to the main site.

  Why: Google shows one favicon per hostname and takes it from the home
  page. cobusnel.com currently declares no favicon at all, which is why the
  search result shows a generic globe. Nothing you add under /calculator
  can fix that; Google does not read favicons from subdirectories.

  Upload these files to the ROOT of cobusnel.com first, so they resolve at
  https://cobusnel.com/favicon.ico and so on. They are in brand-assets/:

    favicon.ico              multi-resolution: 16/24/32/48/64/128/256
    favicon.svg              vector, for browsers that prefer it
    apple-touch-icon.png     180x180, opaque
    icon-192.png
    icon-512.png
    icon-512-maskable.png    Android adaptive, 40% safe zone
    site.webmanifest
    og-cobusnel.jpg          1200x630 share card

  Then confirm robots.txt blocks neither Googlebot nor Googlebot-Image from
  the home page or the icons, and request indexing on the home page in
  Search Console. Google takes several days to several weeks to refresh a
  favicon.
════════════════════════════════════════════════════════════════════════════
-->

<!-- ── Icons ──────────────────────────────────────────────────────────── -->
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0A0A0A">

<!-- ── Title and description ──────────────────────────────────────────
     The current description is 197 characters. Google is already ignoring
     it and writing its own snippet from body copy, which is what the
     truncated "… tax-efficient structures" in the live result is. This one
     is 143 characters, inside the ~155 Google will render, and it leads
     with the two facts that separate him from every other adviser: the
     CA(SA) and the FSP number.
     ─────────────────────────────────────────────────────────────────── -->
<title>Cobus Nel | South Africa's Capital Architect</title>
<meta name="description" content="Cobus Nel, CA(SA), is Chief Investment Officer of Eridanus (FSP 48947), acquiring real South African agricultural assets at below-market value.">
<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">
<link rel="canonical" href="https://cobusnel.com/">

<!-- ── Structured data ─────────────────────────────────────────────────

     Google's AI surfaces describe him. Without it they guess from prose.
     With it they get the entity, the role, the regulator and the licence
     number as facts.

     Every statement below is already visible on the site, which is what
     Google's structured-data policy requires. Do not add a claim the page
     does not make out loud.

     >>> BEFORE SHIPPING: fill in or DELETE the two placeholder sameAs
     URLs. A wrong URL is worse than a missing one.
     ─────────────────────────────────────────────────────────────────── -->

    },
    {
